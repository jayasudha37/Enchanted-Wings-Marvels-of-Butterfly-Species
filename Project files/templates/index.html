
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanted Wings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            color: #222222;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 460px;
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #777777;
            margin: 0 0 32px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #dddddd;
            border-radius: 4px;
            background: #ffffff;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 1px solid #222222;
            border-radius: 4px;
            background: #222222;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444444;
        }

        .result {
            margin-top: 35px;
        }

        .species {
            font-size: 27px;
            font-weight: 600;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .error {
            margin-top: 22px;
            color: #b00020;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 25px;
            }

            .species {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Enchanted Wings</h1>

        <p class="subtitle">
            Marvels of Butterfly Species
        </p>

        <form action="/predict"
              method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="image"
                   accept="image/*"
                   required>

            <button type="submit">Predict Species</button>
        </form>

        {% if prediction_text %}
            <div class="result">
                <p class="species">{{ prediction_text }}</p>
            </div>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
