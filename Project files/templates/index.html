

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanted Wings - Butterfly Classifier</title>
</head>
<body>
    <h1>Enchanted Wings</h1>
    <h2>Marvels of Butterfly Species</h2>

    <p>Upload a butterfly image to predict its species.</p>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Predict Butterfly Species</button>
    </form>

    {% if prediction_text %}
        <h2>{{ prediction_text }}</h2>
    {% endif %}
</body>
</html>
